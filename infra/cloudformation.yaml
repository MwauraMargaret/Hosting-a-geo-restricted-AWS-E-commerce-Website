AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Meridian Market. Two EC2 instances behind an Application Load Balancer,
  published through CloudFront only to viewers in Africa and Asia, with a
  Route 53 domain. Deploy this stack in us-east-1.

Rules:
  DeployInUsEast1:
    Assertions:
      - Assert: !Equals [!Ref "AWS::Region", "us-east-1"]
        AssertDescription: >
          Deploy this stack in us-east-1. The CloudFront certificate has to
          be created in that Region.

Parameters:
  DomainName:
    Type: String
    Description: Apex name viewers will use, such as example.com or shop.example.com. The template also publishes www.
    AllowedPattern: '^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,}$'
    ConstraintDescription: Use a lowercase DNS name.
  HostedZoneId:
    Type: String
    Description: Public Route 53 hosted zone that is already authoritative for DomainName.
    AllowedPattern: '^Z[A-Z0-9]+$'
  CloudFrontPrefixListId:
    Type: AWS::EC2::PrefixList::Id
    Description: Regional ID of the managed prefix list com.amazonaws.global.cloudfront.origin-facing.
  OriginVerifySecret:
    Type: String
    NoEcho: true
    MinLength: 24
    MaxLength: 64
    AllowedPattern: '^[A-Za-z0-9]+$'
    Description: Shared secret CloudFront sends and the load balancer requires. Letters and digits only.
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
      - t2.micro
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: meridian-market

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: meridian-market

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: meridian-market-public

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.20.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: meridian-market-public-a

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.20.2.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: meridian-market-public-b

  PublicSubnetARoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP from CloudFront origin-facing addresses only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixListId
          Description: CloudFront origin-facing prefix list
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 10.20.0.0/16
          Description: Web servers in the VPC
      Tags:
        - Key: Name
          Value: meridian-market-alb

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP from the load balancer only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: Load balancer
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Install packages and reach AWS APIs
      Tags:
        - Key: Name
          Value: meridian-market-web

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Name
          Value: meridian-market-site

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ReadSiteBucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt SiteBucket.Arn
                  - !Sub ${SiteBucket.Arn}/*

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        SecurityGroupIds:
          - !Ref InstanceSecurityGroup
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
          HttpPutResponseHopLimit: 2
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: meridian-market-web
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euo pipefail
            exec > /var/log/user-data.log 2>&1
            SITE_BUCKET="${SiteBucket}"
            AWS_REGION="${AWS::Region}"
            export SITE_BUCKET AWS_REGION
            dnf install -y nginx
            install -d -m 755 /usr/share/nginx/html
            cat > /usr/share/nginx/html/index.html <<'EOF'
            <!DOCTYPE html>
            <html lang="en">
            <head><meta charset="utf-8"><title>Meridian Market</title></head>
            <body><p>Meridian Market is publishing the storefront. Refresh shortly.</p></body>
            </html>
            EOF
            cat > /usr/local/bin/pull-site.sh <<EOF
            #!/bin/bash
            set -euo pipefail
            if aws s3api head-object --bucket "$SITE_BUCKET" --key index.html --region "$AWS_REGION" >/dev/null 2>&1; then
              aws s3 sync "s3://$SITE_BUCKET/" /usr/share/nginx/html/ --delete --region "$AWS_REGION"
              systemctl reload nginx || systemctl restart nginx
            fi
            EOF
            chmod 755 /usr/local/bin/pull-site.sh
            systemctl enable nginx
            systemctl start nginx
            /usr/local/bin/pull-site.sh || true

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: 80
      Protocol: HTTP
      VpcId: !Ref Vpc
      HealthCheckPath: /
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: "200"
      TargetType: instance
      Tags:
        - Key: Name
          Value: meridian-market

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: GatewayAttachment
    Properties:
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Tags:
        - Key: Name
          Value: meridian-market

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: "403"
            ContentType: text/plain
            MessageBody: Direct access is not available.

  ListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Origin-Verify
            Values:
              - !Ref OriginVerifySecret
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  WebFleet:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      MinSize: 2
      MaxSize: 2
      DesiredCapacity: 2
      VPCZoneIdentifier:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      TargetGroupARNs:
        - !Ref TargetGroup
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      Tags:
        - Key: Name
          Value: meridian-market-web
          PropagateAtLaunch: true

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub www.${DomainName}
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Sub www.${DomainName}
          HostedZoneId: !Ref HostedZoneId

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        IPV6Enabled: true
        HttpVersion: http2
        PriceClass: PriceClass_All
        Comment: Meridian Market Africa and Asia only
        DefaultRootObject: index.html
        Aliases:
          - !Ref DomainName
          - !Sub www.${DomainName}
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: alb
            DomainName: !GetAtt LoadBalancer.DNSName
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Ref OriginVerifySecret
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
              HTTPSPort: 443
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
        Restrictions:
          GeoRestriction:
            RestrictionType: whitelist
            Locations:
              # Africa, UN M49, plus territories geolocated separately.
              - DZ
              - AO
              - BJ
              - BW
              - BF
              - BI
              - CV
              - CM
              - CF
              - TD
              - KM
              - CG
              - CD
              - CI
              - DJ
              - EG
              - GQ
              - ER
              - SZ
              - ET
              - GA
              - GM
              - GH
              - GN
              - GW
              - KE
              - LS
              - LR
              - LY
              - MG
              - MW
              - ML
              - MR
              - MU
              - MA
              - MZ
              - NA
              - NE
              - NG
              - RW
              - ST
              - SN
              - SC
              - SL
              - SO
              - ZA
              - SS
              - SD
              - TZ
              - TG
              - TN
              - UG
              - ZM
              - ZW
              - EH
              - RE
              - YT
              - SH
              - IO
              - TF
              # Asia, UN M49. Turkey, Cyprus, and the Caucasus are in Asia
              # on that list. Russia is in Europe and is not included.
              - AF
              - AM
              - AZ
              - BH
              - BD
              - BT
              - BN
              - KH
              - CN
              - CY
              - GE
              - HK
              - IN
              - ID
              - IR
              - IQ
              - IL
              - JP
              - JO
              - KZ
              - KW
              - KG
              - LA
              - LB
              - MO
              - MY
              - MV
              - MN
              - MM
              - NP
              - KP
              - OM
              - PK
              - PS
              - PH
              - QA
              - SA
              - SG
              - KR
              - LK
              - SY
              - TW
              - TJ
              - TH
              - TL
              - TR
              - TM
              - AE
              - UZ
              - VN
              - YE

  ApexA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  ApexAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  WwwA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub www.${DomainName}
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  WwwAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub www.${DomainName}
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

Outputs:
  WebsiteUrl:
    Description: Storefront URL
    Value: !Sub https://${DomainName}
  CloudFrontDistributionId:
    Description: Distribution ID
    Value: !Ref Distribution
  CloudFrontDomainName:
    Description: Default CloudFront domain, useful before DNS finishes propagating
    Value: !GetAtt Distribution.DomainName
  LoadBalancerDnsName:
    Description: Origin address. It should time out from the public internet.
    Value: !GetAtt LoadBalancer.DNSName
  SiteBucketName:
    Description: Private bucket that holds the published site files
    Value: !Ref SiteBucket
  AutoScalingGroupName:
    Description: Group that keeps two web servers running
    Value: !Ref WebFleet
